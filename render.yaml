services:
  - type: web
    name: glof-sentinel-api
    env: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # Set to Vercel domain later, e.g. https://my-frontend.vercel.app
      - key: ENVIRONMENT
        value: production
