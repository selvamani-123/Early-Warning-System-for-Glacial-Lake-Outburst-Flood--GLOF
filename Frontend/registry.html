<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Registry | GLOF Sentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'], },
                    colors: {
                        bgMain: '#050B14', bgPanel: '#0A1322', bgGlass: 'rgba(10, 19, 34, 0.65)', borderGlass: 'rgba(255, 255, 255, 0.08)',
                        textPrimary: '#E2E8F0', textSecondary: '#94A3B8',
                        riskLow: '#10B981', riskModerate: '#F59E0B', riskHigh: '#F97316', riskCritical: '#EF4444', accent: '#3B82F6'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050B14; color: #E2E8F0; letter-spacing: -0.01em; }
        .glass-panel {
            background: rgba(10, 19, 34, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050B14; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .nav-item.active { border-left: 3px solid theme('colors.accent'); background: rgba(59, 130, 246, 0.1); color: #fff;}
    </style>
    <script src="js/layout.js"></script>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden">

    <app-header></app-header>

    <div class="flex flex-1 overflow-hidden">
        <app-sidebar></app-sidebar>

        <main class="flex-1 overflow-y-auto p-6 bg-bgMain">
            <div class="flex flex-col md:flex-row md:justify-between md:items-end mb-6 gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-white tracking-tight">Glacial Lakes Database</h1>
                    <p class="text-sm text-textSecondary mt-1">Comprehensive index of all monitored glacial lakes and their current ML-assessed risk states.</p>
                </div>
                <div class="flex gap-4">
                    <select class="bg-bgPanel border border-white/10 text-textSecondary text-sm rounded px-3 py-1.5 focus:outline-none focus:border-accent">
                        <option>All Regions</option>
                        <option>Himalayas</option>
                        <option>Andes</option>
                        <option>Alps</option>
                    </select>
                    <select class="bg-bgPanel border border-white/10 text-textSecondary text-sm rounded px-3 py-1.5 focus:outline-none focus:border-accent" id="filter-risk">
                        <option value="ALL">All Risk Levels</option>
                        <option value="CRITICAL">Critical Only</option>
                        <option value="HIGH">High Only</option>
                    </select>
                </div>
            </div>

            <div class="glass-panel rounded-xl overflow-hidden border border-white/10">
                <div class="overflow-x-auto w-full">
                    <table class="w-full text-sm text-left min-w-[800px]">
                    <thead class="text-xs text-textSecondary uppercase bg-white/5 border-b border-white/10">
                        <tr>
                            <th class="px-6 py-4">Lake Name</th>
                            <th class="px-6 py-4">Region</th>
                            <th class="px-6 py-4">Elevation (m)</th>
                            <th class="px-6 py-4">Area (km²)</th>
                            <th class="px-6 py-4">Risk Status</th>
                            <th class="px-6 py-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="registry-body">
                        <tr>
                            <td colspan="6" class="px-6 py-10 text-center text-textSecondary">
                                <span class="material-symbols-outlined animate-spin text-3xl">sync</span>
                                <p class="mt-2">Loading geospatial database...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/search.js"></script>
    <script>
        let allLakes = [];

        async function fetchRegistry() {
            try {
                const res = await fetch(`${window.API_BASE}/api/v1/registry/lakes`);
                if(!res.ok) throw new Error("Failed to fetch");
                const data = await res.json();
                allLakes = data.features;
                renderTable(allLakes);
            } catch(e) {
                console.error(e);
                document.getElementById('registry-body').innerHTML = `
                    <tr><td colspan="6" class="px-6 py-10 text-center text-riskCritical">Error connecting to geospatial backend. Ensure uvicorn is running.</td></tr>
                `;
            }
        }

        function renderTable(features) {
            const tbody = document.getElementById('registry-body');
            tbody.innerHTML = '';
            
            features.forEach(f => {
                const p = f.properties;
                const isCritical = p.risk === 'CRITICAL';
                const isHigh = p.risk === 'HIGH';
                const isModerate = p.risk === 'MODERATE';
                const badgeClass = isCritical ? 'bg-riskCritical text-white' : 
                                  (isHigh ? 'bg-riskHigh text-white' : 
                                  (isModerate ? 'bg-riskModerate text-white' : 'bg-riskLow text-white'));
                
                const tr = document.createElement('tr');
                tr.className = 'border-b border-white/10 hover:bg-white/5 transition-colors group';
                tr.innerHTML = `
                    <td class="px-6 py-4 font-bold text-white flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-${isCritical?'riskCritical':(isHigh?'riskHigh':'riskLow')}"></span>
                        ${p.name}
                    </td>
                    <td class="px-6 py-4 text-textSecondary">${p.region || 'Global'}</td>
                    <td class="px-6 py-4 font-mono text-textSecondary">${p.elevation}</td>
                    <td class="px-6 py-4 font-mono text-accent">${p.area_km2}</td>
                    <td class="px-6 py-4"><span class="text-[10px] font-bold px-2 py-0.5 rounded uppercase ${badgeClass}">${p.risk}</span></td>
                    <td class="px-6 py-4 text-right">
                        <a href="lake_intelligence.html?id=${p.id}" class="text-accent hover:text-white flex items-center justify-end gap-1 text-xs font-bold transition-colors">
                            Analyze <span class="material-symbols-outlined text-[14px]">chevron_right</span>
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('filter-risk').addEventListener('change', (e) => {
            if(e.target.value === 'ALL') renderTable(allLakes);
            else renderTable(allLakes.filter(f => f.properties.risk === e.target.value));
        });

        fetchRegistry();
    </script>
</body>
</html>
