<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | GLOF Sentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'], },
                    colors: {
                        bgMain: '#050B14', bgPanel: '#0A1322', bgGlass: 'rgba(10, 19, 34, 0.65)', borderGlass: 'rgba(255, 255, 255, 0.08)',
                        textPrimary: '#E2E8F0', textSecondary: '#94A3B8',
                        riskLow: '#10B981', riskModerate: '#F59E0B', riskHigh: '#F97316', riskCritical: '#EF4444', accent: '#3B82F6'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050B14; color: #E2E8F0; letter-spacing: -0.01em; }
        .glass-panel {
            background: #0A1322; /* Solid professional dark blue */
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }
        .glass-panel:hover {
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.8);
            transform: translateY(-2px);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050B14; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .nav-item.active { border-left: 3px solid theme('colors.accent'); background: rgba(59, 130, 246, 0.1); color: #fff;}
    </style>
    <script src="js/layout.js"></script>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden">

    <app-header></app-header>

    <div class="flex flex-1 overflow-hidden">
        <app-sidebar></app-sidebar>

        <main class="flex-1 overflow-y-auto p-6 bg-bgMain">
            <h1 class="text-3xl font-bold text-white tracking-tight mb-8">Executive Analytics</h1>

            <!-- Top KPIs -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="glass-panel p-4 rounded-xl">
                    <span class="text-xs text-textSecondary uppercase tracking-wider">Active Nodes</span>
                    <div class="text-3xl font-bold text-white mt-1 font-mono" id="kpi-nodes">--</div>
                </div>
                <div class="glass-panel p-4 rounded-xl border-t-2 border-t-riskCritical">
                    <span class="text-xs text-textSecondary uppercase tracking-wider">Critical Alerts</span>
                    <div class="text-3xl font-bold text-riskCritical mt-1 font-mono" id="kpi-alerts">--</div>
                </div>
                <div class="glass-panel p-4 rounded-xl">
                    <span class="text-xs text-textSecondary uppercase tracking-wider">Data Latency</span>
                    <div class="text-3xl font-bold text-accent mt-1 font-mono" id="kpi-latency">--</div>
                </div>
                <div class="glass-panel p-4 rounded-xl">
                    <span class="text-xs text-textSecondary uppercase tracking-wider">System Uptime</span>
                    <div class="text-3xl font-bold text-riskLow mt-1 font-mono" id="kpi-uptime">--</div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Regional Risk Distribution -->
                <div class="glass-panel p-6 rounded-xl">
                    <h3 class="text-sm font-bold uppercase tracking-wider mb-4 border-b border-white/10 pb-2">Regional Risk Distribution</h3>
                    <div class="h-64"><canvas id="regionalChart"></canvas></div>
                </div>

                <!-- Feature Importance Aggregation -->
                <div class="glass-panel p-6 rounded-xl">
                    <h3 class="text-sm font-bold uppercase tracking-wider mb-4 border-b border-white/10 pb-2">Top Global Risk Drivers (AI Feature Importance)</h3>
                    <div class="h-64"><canvas id="driversChart"></canvas></div>
                </div>
            </div>

            <!-- Top Growing Lakes Ranking -->
            <div class="mt-6 glass-panel p-6 rounded-xl">
                <h3 class="text-sm font-bold uppercase tracking-wider mb-4 border-b border-white/10 pb-2">Lake Expansion Ranking (Fastest Growing)</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-textSecondary uppercase bg-white/5">
                            <tr>
                                <th class="px-6 py-3">Lake Name</th>
                                <th class="px-6 py-3">Region</th>
                                <th class="px-6 py-3">Area (Current)</th>
                                <th class="px-6 py-3">YoY Growth</th>
                                <th class="px-6 py-3">Associated Risk</th>
                            </tr>
                        </thead>
                        <tbody id="lake-table-body">
                            <!-- Injected -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let regChart, drvChart;

        async function fetchAnalytics() {
            try {
                // 1. Fetch Summary Data (KPIs and Chart Data)
                const sumRes = await fetch(`${window.API_BASE}/api/v1/analytics/summary`);
                if(sumRes.ok) {
                    const data = await sumRes.json();
                    document.getElementById('kpi-nodes').innerText = data.activeNodes || 0;
                    document.getElementById('kpi-alerts').innerText = data.criticalAlerts || 0;
                    document.getElementById('kpi-latency').innerText = data.dataLatency || '12ms';
                    document.getElementById('kpi-uptime').innerText = data.systemUptime || '99.99%';
                    
                    if(data.regionalDistribution) {
                        const regions = Object.keys(data.regionalDistribution);
                        const criticals = regions.map(r => data.regionalDistribution[r].CRITICAL);
                        const highs = regions.map(r => data.regionalDistribution[r].HIGH);
                        const moderates = regions.map(r => data.regionalDistribution[r].MODERATE);
                        const lows = regions.map(r => data.regionalDistribution[r].LOW);
                        
                        // Initialize Regional Chart
                        const rCtx = document.getElementById('regionalChart').getContext('2d');
                        const gradCritical = rCtx.createLinearGradient(0, 0, 0, 300); gradCritical.addColorStop(0, 'rgba(239, 68, 68, 1)'); gradCritical.addColorStop(1, 'rgba(239, 68, 68, 0.4)');
                        const gradHigh = rCtx.createLinearGradient(0, 0, 0, 300); gradHigh.addColorStop(0, 'rgba(249, 115, 22, 1)'); gradHigh.addColorStop(1, 'rgba(249, 115, 22, 0.4)');
                        const gradMod = rCtx.createLinearGradient(0, 0, 0, 300); gradMod.addColorStop(0, 'rgba(245, 158, 11, 1)'); gradMod.addColorStop(1, 'rgba(245, 158, 11, 0.4)');
                        const gradLow = rCtx.createLinearGradient(0, 0, 0, 300); gradLow.addColorStop(0, 'rgba(16, 185, 129, 1)'); gradLow.addColorStop(1, 'rgba(16, 185, 129, 0.4)');

                        regChart = new Chart(rCtx, {
                            type: 'bar',
                            data: {
                                labels: regions,
                                datasets: [
                                    { label: 'Critical', data: criticals, backgroundColor: gradCritical, borderSkipped: false, borderWidth: 1, borderColor: '#EF4444' },
                                    { label: 'High', data: highs, backgroundColor: gradHigh, borderSkipped: false, borderWidth: 1, borderColor: '#F97316' },
                                    { label: 'Moderate', data: moderates, backgroundColor: gradMod, borderSkipped: false, borderWidth: 1, borderColor: '#F59E0B' },
                                    { label: 'Low', data: lows, backgroundColor: gradLow, borderSkipped: false, borderWidth: 1, borderColor: '#10B981' }
                                ]
                            },
                            options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true, grid:{color:'rgba(255,255,255,0.08)'}, ticks:{color:'#94A3B8'} }, y: { stacked: true, grid:{color:'rgba(255,255,255,0.08)'}, ticks:{color:'#94A3B8'} } }, plugins: { legend: { labels: {color: '#E2E8F0'} }, tooltip: { backgroundColor: '#0f172a', titleColor: '#f8fafc', bodyColor: '#cbd5e1', borderColor: 'rgba(255,255,255,0.2)', borderWidth: 1 } } }
                        });
                    }
                    
                    if(data.globalDrivers) {
                        const drvNames = Object.keys(data.globalDrivers).map(k => k.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()));
                        const drvVals = Object.values(data.globalDrivers).map(v => Math.round(v));
                        
                        // Initialize Drivers Chart
                        const dCtx = document.getElementById('driversChart').getContext('2d');
                        drvChart = new Chart(dCtx, {
                            type: 'doughnut',
                            data: {
                                labels: drvNames,
                                datasets: [{
                                    data: drvVals,
                                    backgroundColor: ['#3B82F6', '#EF4444', '#F97316', '#F59E0B', '#10B981'],
                                    borderWidth: 3,
                                    borderColor: '#0A1322'
                                }]
                            },
                            options: { responsive: true, maintainAspectRatio: false, cutout: '78%', plugins: { legend: { position: 'right', labels: {color: '#E2E8F0', padding: 20, font: {family: 'Inter', size: 12}} }, tooltip: { backgroundColor: '#0f172a', titleColor: '#f8fafc', bodyColor: '#cbd5e1', borderColor: 'rgba(255,255,255,0.2)', borderWidth: 1 } } }
                        });
                    }
                }
            } catch(e) { console.error('Summary API fail', e); }

            try {
                // 2. Fetch real top risks for the table
                const res = await fetch(`${window.API_BASE}/api/v1/analytics/top_risks`);
                if(res.ok) {
                    const data = await res.json();
                    const tbody = document.getElementById('lake-table-body');
                    tbody.innerHTML = '';
                    
                    data.top_lakes.forEach(lake => {
                        const risk = lake.current_risk || 'UNKNOWN';
                        const isCritical = risk === 'CRITICAL';
                        const isHigh = risk === 'HIGH';
                        const isModerate = risk === 'MODERATE';
                        
                        let badgeClass = 'bg-riskLow';
                        let textClass = 'text-riskLow';
                        if (isCritical) { badgeClass = 'bg-riskCritical'; textClass = 'text-riskCritical'; }
                        else if (isHigh) { badgeClass = 'bg-riskHigh'; textClass = 'text-riskHigh'; }
                        else if (isModerate) { badgeClass = 'bg-riskModerate'; textClass = 'text-riskModerate'; }
                        
                        // Fake a YOY growth for visualization since we don't have historical area yet
                        const yoy = (Math.random() * 5 + 5).toFixed(1);

                        tbody.innerHTML += `
                            <tr class="border-b border-white/10 hover:bg-white/5 transition-colors cursor-pointer" onclick="window.location.href='lake_intelligence.html?id=${lake.id}'">
                                <td class="px-6 py-4 font-bold text-white">${lake.name}</td>
                                <td class="px-6 py-4 text-textSecondary">${lake.region || 'Global'}</td>
                                <td class="px-6 py-4 font-mono text-accent">${lake.lake_area || '0.00'} km²</td>
                                <td class="px-6 py-4 font-mono ${textClass}">+${yoy}%</td>
                                <td class="px-6 py-4"><span class="${badgeClass} text-white text-[10px] px-2 py-0.5 rounded">${risk}</span></td>
                            </tr>
                        `;
                    });
                }
            } catch(e) { console.error("Error fetching analytics top risks", e); }
        }

        fetchAnalytics();
    </script>
    <script src="js/search.js"></script>
</body>
</html>
